#########################################
#Configure OSPF
#########################################
# interface Loopback0
#  ip address 192.168.74.13 255.255.255.255
#  no shutdown
#  exit

router ospf 1
 router-id 192.168.74.13
 default-information originate always
 network 192.168.68.2 255.255.255.254 area 0
 network 192.168.65.4 255.255.255.254 area 0
 network 192.168.65.10 255.255.255.254 area 0
 network 192.168.65.16 255.255.255.254 area 0
 neighbor 192.168.68.2 interface inter-connection
 neighbor 192.168.65.4 interface csr1
 neighbor 192.168.65.10 interface csr2
 neighbor 192.168.65.16 interface csr-shadow
 exit

#########################################
#Configure Horizontal Links
#########################################
interface g0/3
 nameif inter-connection
 ip address 192.168.68.3 255.255.255.254
#  ip ospf 1 area 0
 ospf network point-to-point non-broadcast
 ospf cost 65535
#  no ip unreachables
 no shutdown
 exit

#########################################
#Configure CSR Uplinks
#########################################
interface g0/4
 nameif csr1
 ip address 192.168.65.5 255.255.255.254
#  ip ospf 1 area 0
 ospf network point-to-point non-broadcast
 ospf cost 10
#  no ip unreachables
 no shutdown
 exit

interface g0/5
 nameif csr2
 ip address 192.168.65.11 255.255.255.254
#  ip ospf 1 area 0
 ospf network point-to-point non-broadcast
 ospf cost 10
#  no ip unreachables
 no shutdown
 exit

interface g0/6
 nameif csr-shadow
 ip address 192.168.65.17 255.255.255.254
 ospf network point-to-point non-broadcast
 ospf cost 9999
#  no ip unreachables
 no shutdown
 exit

#########################################
#Configure ISP Uplinks
#########################################
interface g0/0
 nameif isp1
 ip address 203.0.113.4 255.255.255.240
 ospf network point-to-point non-broadcast
 ospf cost 10
#  no ip unreachables
 no shutdown
 exit

interface g0/1
 nameif isp2
 ip address 198.51.100.4 255.255.255.240
 ospf network point-to-point non-broadcast
 ospf cost 9999
#  no ip unreachables
 no shutdown
 exit

interface g0/2
 nameif isp3
 ip address 192.0.2.4 255.255.255.240
 ospf network point-to-point non-broadcast
 ospf cost 10
#  no ip unreachables
 no shutdown
 exit

#########################################
#ISP Load Balancing
#########################################
## IP SLA when uplinks down
sla monitor 1
 type echo protocol ipIcmpEcho 203.0.113.1 interface isp1
 frequency 30
 exit
sla monitor schedule 1 life forever start-time now

sla monitor 2
 type echo protocol ipIcmpEcho 198.51.100.1 interface isp2
 frequency 30
 exit
sla monitor schedule 2 life forever start-time now

sla monitor 3
 type echo protocol ipIcmpEcho 192.0.2.1 interface isp3
 frequency 30
 exit
sla monitor schedule 3 life forever start-time now

track 1 rtr 1 reachability
track 2 rtr 2 reachability
track 3 rtr 3 reachability

#########################################
#Configure Static Routes
#########################################
route isp1 0.0.0.0 0.0.0.0 203.0.113.1 20 track 1
route isp2 0.0.0.0 0.0.0.0 198.51.100.1 30 track 2
route isp3 0.0.0.0 0.0.0.0 192.0.2.1 10 track 3